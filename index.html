<!DOCTYPE html>
<html lang="id" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Universal App Promo</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Fredoka:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Press+Start+2P&family=Space+Mono:ital,wght@0,700;1,700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <!-- Reusable SVG Filters for Domain Warp & Film Grain -->
    <svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true">
      <defs>
        <filter id="hf-warp-filter" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.018 0.025" numOctaves="2" seed="7" result="noise" />
          <feDisplacementMap id="hf-warp-disp" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="hf-grain-filter">
          <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" stitchTiles="stitch" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
      </defs>
    </svg>

    <div id="root" data-composition-id="main" data-width="1080" data-height="1920">
      <!-- Progress Bar -->
      <div id="progress-wrap"><div id="progress-bar"></div></div>

      <!-- Container Scenes (generated dynamically) -->
      <div id="scenes-wrapper"></div>

      <!-- Audio Container (Stamped by sync.js) -->
      <div id="audio-wrapper">
        <audio id="scene-1-audio-vo" src="assets/1.wav" data-start="0.00" data-duration="5.00" data-volume="1.0" data-track-index="1"></audio>
        <audio id="scene-2-audio-vo" src="assets/2.wav" data-start="5.40" data-duration="5.88" data-volume="1.0" data-track-index="1"></audio>
        <audio id="scene-3-audio-vo" src="assets/3.wav" data-start="11.60" data-duration="4.96" data-volume="1.0" data-track-index="1"></audio>
        <audio id="scene-4-audio-vo" src="assets/4.wav" data-start="16.90" data-duration="4.96" data-volume="1.0" data-track-index="1"></audio>
        <audio id="scene-5-audio-vo" src="assets/5.wav" data-start="22.20" data-duration="5.32" data-volume="1.0" data-track-index="1"></audio>
        <audio id="scene-6-audio-vo" src="assets/6.wav" data-start="27.90" data-duration="6.84" data-volume="1.0" data-track-index="1"></audio>
        <audio id="scene-7-audio-vo" src="assets/7.wav" data-start="35.10" data-duration="6.40" data-volume="1.0" data-track-index="1"></audio>
        <audio id="scene-8-audio-vo" src="assets/8.wav" data-start="41.90" data-duration="6.00" data-volume="1.0" data-track-index="1"></audio>
        <audio id="scene-9-audio-vo" src="assets/9.wav" data-start="48.30" data-duration="6.32" data-volume="1.0" data-track-index="1"></audio>
        <audio id="bgm-audio" src="assets/bgm.mp3" data-start="0.00" data-duration="55.00" data-volume="0.13" data-track-index="0"></audio>
      </div>
    </div>

    <!-- Default / Fallback configuration data -->
    <script id="default-scenes-data" type="application/json">
{
  "project": {
    "appName": "Creative Island Hub",
    "websiteUrl": "https://play.google.com/store/apps/details?id=com.henrisusanto.creativeislandhub",
    "ctaHeadline": "DOWNLOAD DI GOOGLE PLAY",
    "ctaSubline": "Cari Creative Island Hub di Google Play Store",
    "theme": {
      "primaryColor": "#7C3AED",
      "accentColor": "#F59E0B",
      "highlightColor": "#22D3EE",
      "bgDark": "#0B1020"
    }
  },
  "scenes": []
}
    </script>

    <!-- Runtime Data & Engine -->
    <script src="scenes.js"></script>
    <script src="engine.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        window.__timelines['main'] = tl;
        if (typeof window.initAppPromoComposition === 'function') {
          window.initAppPromoComposition(tl);
        }
      })();
    </script>
  </body>
</html>
